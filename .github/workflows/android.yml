warning: /bin/sh: setlocale: LC_ALL: cannot change locale (C.UTF-8)
name: Android Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle :app:assembleDebug

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.0.65
          apk=content-transfer-v1.0.65.apk
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 -o "$apk" \
            "http://nas.yode.ink:8084/download/files/$apk"
          echo "9dddded38e3ecc55f16dc5c3913330b35d690e182510c29ec919ad85ea10d4ef  $apk" | sha256sum --check
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "内容中转 Android 1.0.65" \
              --notes "设备中心改为从底部滑入的全窗口页面；设备窄条只显示在文字、文件和链接区；系统分享上传与 App 主界面任务卡统一实时进度；修复文件已上传到 NAS 但任务仍停留在等待处理的问题。使用原生产证书签名，可覆盖升级。"
          fi
