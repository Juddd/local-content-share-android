name: Android Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle :app:assembleDebug

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.0.70
          apk=content-transfer-v1.0.70.apk
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 -o "$apk" \
            "http://nas.yode.ink:8084/download/files/$apk"
          echo "beca0024104584cea99f63393f2e968f13649e2349b2f91f1551fdd174eff375  $apk" | sha256sum --check
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "内容中转 Android 1.0.70" \
              --notes "文字区悬浮搜索按钮支持手指拖动并永久记住位置；只有单击才打开搜索，拖动松手不会误触；按钮始终限制在内容区内。使用原生产证书签名，可覆盖升级。"
          fi
