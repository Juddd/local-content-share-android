name: Android Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle :app:assembleDebug

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.0.69
          apk=content-transfer-v1.0.69.apk
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 -o "$apk" \
            "http://nas.yode.ink:8084/download/files/$apk"
          echo "d6e55af751a29850ca6b9ac0bb392faa1b2cfaf4ad8f2d5f0978a9cb9201e00f  $apk" | sha256sum --check
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "内容中转 Android 1.0.69" \
              --notes "文字区新增紧凑搜索入口，实时匹配标题和完整正文；搜索基于本地数据，离线可用；收藏排序、实时同步和局部变更会自动重新应用搜索条件。使用原生产证书签名，可覆盖升级。"
          fi
