name: Android Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle :app:assembleDebug

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.0.64
          apk=content-transfer-v1.0.64.apk
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 -o "$apk" \
            "http://nas.yode.ink:8084/download/files/$apk"
          echo "1ed13a43f682ac0b4c62064e03700df9c866b750f6af1bbb5fb9a1c8cfd8e1b  $apk" | sha256sum --check
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "内容中转 Android 1.0.64" \
              --notes "内容区新增浏览器设备状态窄条；设备详情支持 IP 局域网/外网标识、同行图标重命名和锁定操作；服务端自动清理超过 30 天未活动的离线设备。使用原生产证书签名，可覆盖升级。"
          fi
