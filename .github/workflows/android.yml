name: Android Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle :app:assembleDebug

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.0.73
          apk=content-transfer-v1.0.73.apk
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 -o "$apk" \
            "http://nas.yode.ink:8084/download/files/$apk"
          echo "f6f010f90bbce3d72d4780f73b405133a64a80bd355854efdcbccd591c426ead  $apk" | sha256sum --check
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "内容中转 Android 1.0.73" \
              --notes "优化文字区普通与私分类的锁图标对齐与状态样式，分类切换条改为紧凑灰色连续样式，并修复搜索悬浮按钮无法拖到内容区底部的问题。使用原生产证书签名，可覆盖升级。"
          fi
